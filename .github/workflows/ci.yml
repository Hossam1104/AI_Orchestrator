name: AI_Orchestrator CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CONFIGURATION: Release
  SOLUTION: AIUsageMonitor.sln
  DESKTOP_PROJECT: src/AIUsageMonitor.Desktop/AIUsageMonitor.Desktop.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    name: Restore, build, and test
    runs-on: windows-2022
    # The suite includes WPF tests that drive a real dispatcher. Without an explicit bound a hung
    # STA thread would hold a runner for the six-hour GitHub default instead of failing.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # No job here writes to the repository, so the checkout token is not left in .git/config.
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Report SDK
        shell: pwsh
        run: dotnet --info

      - name: Restore solution
        shell: pwsh
        run: dotnet restore $env:SOLUTION --nologo

      - name: Build Release solution
        shell: pwsh
        run: dotnet build $env:SOLUTION --configuration $env:CONFIGURATION --no-restore --nologo

      - name: Run canonical test suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          $testProjects = @(
            @{ Path = 'tests/AIUsageMonitor.Domain.Tests/AIUsageMonitor.Domain.Tests.csproj'; Arguments = @() },
            @{ Path = 'tests/AIUsageMonitor.Connection.Tests/AIUsageMonitor.Connection.Tests.csproj'; Arguments = @() },
            @{ Path = 'tests/AIUsageMonitor.Provider.Tests/AIUsageMonitor.Provider.Tests.csproj'; Arguments = @() },
            @{ Path = 'tests/AIUsageMonitor.Desktop.Tests/AIUsageMonitor.Desktop.Tests.csproj'; Arguments = @('-p:Platform=x64') },
            @{ Path = 'tests/AIUsageMonitor.Infrastructure.Tests/AIUsageMonitor.Infrastructure.Tests.csproj'; Arguments = @() }
          )
          # The list is explicit because the Desktop project needs its own platform argument, so it
          # cannot be inferred. It is checked against the repository instead, otherwise a newly
          # added test project would be skipped by a green run that claims to be the whole suite.
          $discovered = Get-ChildItem -Path tests -Recurse -Filter '*.Tests.csproj' |
            ForEach-Object { (Resolve-Path -Relative $_.FullName) -replace '\\', '/' -replace '^\./', '' }
          $declared = $testProjects | ForEach-Object { $_.Path }
          $missing = $discovered | Where-Object { $declared -notcontains $_ }
          if ($missing) {
            Write-Error "These test projects exist but are not in the canonical suite: $($missing -join ', ')"
            exit 1
          }

          foreach ($testProject in $testProjects) {
            Write-Host "Running tests in $($testProject.Path)"
            dotnet test $testProject.Path --configuration $env:CONFIGURATION --no-build --no-restore --nologo `
              $testProject.Arguments `
              --logger trx --results-directory TestResults `
              -- xUnit.ParallelizeTestCollections=false
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: AI_Orchestrator-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish ${{ matrix.rid }}
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x86
          - win-x64
          - win-arm64
    env:
      RID: ${{ matrix.rid }}
      PUBLISH_DIRECTORY: artifacts/publish/${{ matrix.rid }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Report SDK and publish target
        shell: pwsh
        run: |
          dotnet --info
          Write-Host "Configuration: $env:CONFIGURATION"
          Write-Host "Runtime identifier: $env:RID"

      - name: Restore desktop project for publish
        shell: pwsh
        run: dotnet restore $env:DESKTOP_PROJECT --nologo

      - name: Publish ${{ matrix.rid }}
        shell: pwsh
        run: |
          dotnet publish $env:DESKTOP_PROJECT --configuration $env:CONFIGURATION --no-restore --nologo `
            -p:PublishProfile=$env:RID -o $env:PUBLISH_DIRECTORY

      - name: Validate single-file publish output
        shell: pwsh
        run: |
          ./scripts/Validate-PublishOutput.ps1 `
            -PublishDirectory $env:PUBLISH_DIRECTORY `
            -RuntimeIdentifier $env:RID

      - name: Upload ${{ matrix.rid }} package
        uses: actions/upload-artifact@v7
        with:
          name: AI_Orchestrator-Release-${{ matrix.rid }}
          path: ${{ env.PUBLISH_DIRECTORY }}
          if-no-files-found: error
          retention-days: 14
